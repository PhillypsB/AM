<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<script src="app/config.js"></script>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PNCM – Cobertura SAF y SCD</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="app/legacy.css">
<link rel="stylesheet" href="app/editorial.css">
</head>
<body>
<script src="app/embed.js"></script>

<!-- HEADER -->
<header class="app-header">
  <div class="header-left">
    <div class="brand-lock">
      <div class="brand-logo" aria-hidden="true"></div>
      <div>
        <span class="brand-name">Ayuda Memoria</span>
        <span class="brand-tag">Consulta tu territorio. Presenta con confianza.</span>
      </div>
    </div>
    <div class="header-divider"></div>
    <div class="header-titles">
      <h1>Cobertura de Servicios</h1>
      <p>SAF y SCD · Análisis de Cobertura Territorial</p>
    </div>
  </div>
  <div class="corte-pill">
    <span class="corte-label">Periodo de corte</span>
    <select id="selectCorte" class="corte-select"></select>
  </div>
</header>

<div class="page-wrapper">

  <!-- FILTROS -->
  <section>
    <div class="filter-card">
      <div class="filter-head">
        <button type="button" class="filter-card-title" id="filtroToggle"
                onclick="toggleFiltros()" aria-expanded="true" aria-controls="filtroCuerpo">
          <span class="filter-badge">🔍</span>
          <span class="filter-head-text">
            <span class="filter-title">Consulta tu territorio</span>
            <span class="filter-sub">Encuentra información lista para presentar y compartir</span>
          </span>
          <span class="filtro-resumen" id="filtroResumen"></span>
          <span class="filtro-chevron" aria-hidden="true">⌄</span>
        </button>
        <button type="button" id="avanzadaToggle" class="avanzada-pill"
                onclick="toggleAvanzada()" aria-expanded="false" aria-controls="avanzadaBox">
          <span>⚙&nbsp;Búsqueda avanzada</span>
          <span class="avanzada-chevron" aria-hidden="true">⌄</span>
        </button>
      </div>
      <div id="premiumSearch"></div><div id="filtroCuerpo">
      <div class="filter-row">
        <div class="select-group">
          <label for="selectDepartamento">Departamento</label>
          <select id="selectDepartamento"></select>
        </div>
        <div class="select-group">
          <label for="selectProvincia">Provincia</label>
          <select id="selectProvincia"></select>
        </div>
        <div class="select-group">
          <label for="selectDistrito">Distrito</label>
          <select id="selectDistrito"></select>
        </div>
        <div class="select-group">
          <label for="selectCentroPoblado">Centro Poblado</label>
          <select id="selectCentroPoblado" disabled></select>
        </div>
      </div>
      <!-- Ámbito especial: se muestra al activar "Búsqueda avanzada" (pill del header) -->
      <div id="avanzadaBox" class="filter-row" style="display:none;margin-top:16px;padding-top:16px;border-top:1px dashed #e2e8f0;flex-wrap:wrap;gap:18px;">
      <!-- Buscador en vivo: escribe y filtra sobre todos los ámbitos del corte -->
      <div class="busca-wrap">
        <label for="buscadorAmbito" style="display:block;font-size:.7rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Buscar por nombre</label>
        <span class="busca-lupa" style="top:calc(50% + 11px);">🔍</span>
        <input id="buscadorAmbito" class="busca-input" type="text" autocomplete="off"
               placeholder="Escribe un departamento, provincia, distrito o centro poblado…"
               aria-label="Buscar ámbito por nombre" aria-autocomplete="list" aria-controls="buscadorSug">
        <button type="button" class="busca-limpiar" id="buscadorLimpiar" aria-label="Limpiar búsqueda">✕</button>
        <div id="buscadorSug" class="busca-sug" role="listbox"></div>
      </div>

        <div class="select-group" style="max-width:220px;">
          <label for="selectEspecial" style="display:flex;align-items:center;gap:6px;">
            <span style="background:#1d4ed8;color:#fff;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:50px;letter-spacing:.05em;">ESPECIAL</span>
            <span>Ámbito especial</span>
          </label>
          <select id="selectEspecial" onchange="onEspecialChange()">
            <option value="">— Ninguno —</option>
            <option value="VRAEM">🌿 VRAEM</option>
            <option value="NOR-VRAEM">🌿 NOR-VRAEM</option>
            <option value="FRONTERAS">🛂 FRONTERAS</option>
          </select>
        </div>

        <div id="especial-info" style="display:none;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 14px;font-size:.8rem;color:#1d4ed8;align-items:center;gap:8px;">
          <span id="especial-label"></span>
        </div>
      </div>
      <button type="button" id="btnConsultar" class="btn-consultar" onclick="consultar()">🔍&nbsp;Consultar</button>
      </div>
    </div>
  </section>

  <!-- LOADING -->
  <div id="loadingState" class="loading-wrap hidden">
    <div class="spinner"></div>
    <p>Procesando consulta…</p>
  </div>

  <!-- RESULTADOS -->
  <section id="resultadosArea" class="hidden">
    <div class="results-header">
      <div class="results-id">
        <div class="results-avatar" id="resultadosAvatar" aria-hidden="true">📍</div>
        <div>
          <span class="results-kicker" id="resultadosKicker">Resultados</span>
          <h2 id="resultadosTitulo">Resultados</h2>
          <p id="resultadosSubtitulo"></p>
        </div>
      </div>
      <div class="export-bar" aria-label="Exportar y compartir consulta">
        <button id="btnWord"  class="btn btn-word"  onclick="exportarWord()"        disabled><span>Word</span></button>
        <button id="btnExcel" class="btn btn-excel" onclick="exportarExcel()"       disabled><span>Excel</span></button>
        <button id="btnPPT"   class="btn btn-ppt"   onclick="exportarPPT()"         disabled><span>PPT</span></button>
        <button id="btnWA"    class="btn btn-wa"    onclick="compartirWhatsApp()"   disabled><span>WhatsApp</span></button>
        <button id="btnLink" class="btn btn-link" type="button" onclick="AMPremium.copyLink()">Copiar enlace</button>
      </div>
    </div>
    <div id="resultados" class="kpi-container" style="margin-top:20px"></div>
  </section>

  <!-- FOOTER DE LA APP -->
  <footer id="appFooter" style="margin-top:28px;padding:16px 16px;border-top:1px solid #e2e8f0;color:#6b7280;font-size:.78rem;line-height:1.6;text-align:center;font-family:'Inter','Segoe UI',Roboto,sans-serif;">
    <div id="appFooterText" style="max-width:1200px;margin:0 auto;"></div>
  </footer>

</div><!-- /page-wrapper -->

<!-- LIBRERÍAS -->
<!-- Las librerías de exportación (≈1,5 MB) ya no bloquean el render: se
     descargan la primera vez que se pide un Word, Excel, PPT o imagen. -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="app/export-libraries.js"></script>

<!-- DATA — la fuente única es la carpeta hermana DATOS_PNCM (ver su LEEME.md).
     Un archivo por corte: solo se lee el mes consultado, no los 31 juntos.
     Para sumar un mes se actualiza DATOS_PNCM; este HTML no se toca.
     La misma ruta relativa sirve en el laboratorio (DEVELOPER\AM → DEVELOPER\DATOS_PNCM)
     y publicado (AM_REPO/am → AM_REPO/DATOS_PNCM). -->
<script src="app/data-stores.js"></script>



<div id="premiumNotice" class="premium-notice" role="status" hidden></div>

<script src="app/loader.js"></script>
</body>
</html>
