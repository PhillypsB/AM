<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070708">
<title>Nos mudamos · BRAVO</title>
<meta name="description" content="BRAVO ya tiene casa propia: phillyps-bravo.site. Mira la academia y sigue a tu enlace.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070708'/%3E%3Cpath d='M16 3l1.4 2.9 3.1.5-2.3 2.2.6 3.1L16 10.2l-2.8 1.5.6-3.1-2.3-2.2 3.1-.5z' fill='%23FF4D94'/%3E%3Cpath d='M10.5 13h11l1.3 10h-13.6z' fill='%23141418' stroke='%23FF0A6C' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M9.8 20h12.4l.4 3H9.4z' fill='%23FF0A6C'/%3E%3Cellipse cx='16' cy='24' rx='11' ry='3' fill='%23141418' stroke='%23FF0A6C' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #070708; --bg2: #0d0d10; --ink: #FDF7FA; --soft: #c9c0c5; --faint: #9A8F95;
    --magenta: #FF0A6C; --rose: #FF4D94;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100svh;
    background-image:
      radial-gradient(ellipse 60% 55% at 50% 45%, rgba(255, 10, 108, .22), transparent 70%),
      radial-gradient(ellipse 50% 30% at 50% 100%, rgba(92, 0, 41, .4), transparent 70%);
  }
  [hidden] { display: none !important; }

  /* Encabezado mínimo: el video es la estrella. */
  header {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: max(10px, env(safe-area-inset-top)) 16px 8px; animation: rise .8s var(--ease) both;
  }
  .hat { width: 28px; height: 28px; overflow: visible; flex: none; }
  .hat .star { transform-origin: 14px 5px; animation: star 4.5s var(--ease) .3s both; }
  @keyframes star {
    0% { transform: translateY(-16px) scale(.4); opacity: 0; }
    30% { opacity: 1; }
    60% { transform: translateY(2px) scale(1); }
    100% { transform: none; opacity: 1; filter: drop-shadow(0 0 5px var(--magenta)); }
  }
  h1 { font: 400 clamp(1.4rem, 5vw, 2rem)/1 'Archivo Black', Impact, system-ui, sans-serif; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--magenta); text-shadow: 0 0 22px rgba(255, 10, 108, .5); }

  /* Escenario: el video ocupa todo el alto disponible, en vertical. */
  .stage { min-height: 0; display: grid; place-items: center; padding: 0 12px; }
  .video {
    position: relative; height: 100%; max-width: 100%; aspect-ratio: 9 / 16; overflow: hidden;
    border-radius: 18px; background: var(--bg2) center / cover no-repeat; cursor: pointer;
    border: 1px solid rgba(253, 247, 250, .16);
    box-shadow: 0 0 0 5px rgba(255, 10, 108, .07), 0 20px 80px rgba(255, 10, 108, .28);
    animation: rise .9s var(--ease) .15s both;
  }
  .video video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sound, .play {
    position: absolute; left: 50%; transform: translateX(-50%); border: 0; cursor: pointer; color: var(--ink);
    font: 700 15px/1.2 Manrope, system-ui, sans-serif; background: rgba(7, 7, 8, .78);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 10, 108, .6);
    box-shadow: 0 0 30px rgba(255, 10, 108, .35);
  }
  .sound { bottom: 16px; padding: 12px 18px; border-radius: 999px; white-space: nowrap; animation: glow 1.6s var(--ease) infinite; }
  .play { top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; font-size: 30px; }
  @keyframes glow { 50% { box-shadow: 0 0 44px rgba(255, 10, 108, .7); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Franja inferior: avisa que al terminar el video se puede continuar. */
  .strip {
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(255, 10, 108, .16), rgba(92, 0, 41, .55));
    border-top: 1px solid rgba(255, 10, 108, .55); animation: rise .9s var(--ease) .3s both;
  }
  .strip .progress { position: absolute; left: 0; top: -1px; height: 3px; width: 0; background: var(--magenta); box-shadow: 0 0 12px var(--magenta); transition: width .25s linear; }
  .msg { flex: 1 1 220px; min-width: 0; font-size: 14.5px; color: var(--soft); }
  .msg b { display: block; color: var(--ink); font-size: 15.5px; }
  .msg .dest { color: var(--rose); font-weight: 700; word-break: break-all; }
  .msg small { display: block; margin-top: 2px; color: var(--faint); font-size: 12.5px; }
  .msg small a { color: var(--rose); }
  .btn {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 160px;
    padding: .75em 1.5em; border-radius: 999px; text-decoration: none; cursor: pointer;
    font: 800 16px/1 Manrope, system-ui, sans-serif; background: var(--magenta); color: #070708;
    box-shadow: 0 10px 34px rgba(255, 10, 108, .45); transition: transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .btn:hover:not([aria-disabled=true]) { transform: translateY(-2px); }
  .btn[aria-disabled=true] { background: rgba(253, 247, 250, .08); color: var(--faint); box-shadow: none; cursor: default; border: 1px solid rgba(253, 247, 250, .16); }
  .btn.ready { animation: ready 1.4s var(--ease) 3; }
  @keyframes ready { 50% { transform: scale(1.06); } }
  @media (max-width: 520px) { .btn { width: 100%; } }
  :focus-visible { outline: 2px solid var(--magenta); outline-offset: 3px; border-radius: 10px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<header>
  <svg class="hat" viewBox="0 0 28 28" fill="none" aria-hidden="true">
    <path class="star" d="M14 1l1.2 2.5 2.7.4-2 1.9.5 2.7L14 7.2l-2.4 1.3.5-2.7-2-1.9 2.7-.4z" fill="#FF4D94"/>
    <path d="M8.5 11h11l1.2 10H7.3z" fill="#141418" stroke="#FF0A6C" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M7.7 18h12.6l.4 3H7.3z" fill="#FF0A6C"/>
    <ellipse cx="14" cy="22" rx="11.5" ry="3.2" fill="#141418" stroke="#FF0A6C" stroke-width="1.6"/>
  </svg>
  <h1>BRAVO · Nos <em>mudamos</em></h1>
</header>

<div class="stage">
  <div class="video" id="box" hidden>
    <video id="v" playsinline preload="auto" aria-label="Video de BRAVO ACADEMY"></video>
    <button class="play" id="play" type="button" aria-label="Reproducir el video con sonido" hidden>▶</button>
    <button class="sound" id="sound" type="button" hidden>🔊 Toca la pantalla para el sonido</button>
  </div>
</div>

<footer class="strip" id="strip">
  <i class="progress" id="bar"></i>
  <p class="msg" id="msg" aria-live="polite">
    <b id="msg1">Al terminar el video podrás continuar</b>
    <span>a <span class="dest" id="dest">phillyps-bravo.site</span></span>
    <small id="maia" hidden>¿Guardaste cosas en MAIA? Quedaron en el enlace anterior: <a id="viejo" href="/maia/?viejo=1">abrir MAIA anterior</a>.</small>
    <small><a id="acad" href="https://phillyps-bravo.site/bravo-academy/">Conocer BRAVO ACADEMY →</a></small>
  </p>
  <a class="btn" id="go" href="https://phillyps-bravo.site/" aria-disabled="false">Continuar</a>
</footer>

<noscript><p style="position:fixed;inset:auto 0 70px;text-align:center"><a style="color:#FF4D94" href="https://phillyps-bravo.site/">Continuar a phillyps-bravo.site</a></p></noscript>

<script>
(function () {
  var NEW = 'https://phillyps-bravo.site';
  var VIDEO = NEW + '/bravo-academy/video/bravo-academy-truco.mp4';
  var POSTER = NEW + '/bravo-academy/img/hero-poster.webp';
  var APPS = ['am', 'bravo-academy', 'uppm', 'maia', 'mapa', 'cv', 'convenios', 'presupuesto'];

  // Dónde quería ir la persona: viene en ?de=/ruta/ (lo pone vercel.json). Solo rutas del propio sitio.
  var q = new URLSearchParams(location.search);
  var de = q.get('de') || '/';
  if (!/^\/(?!\/)[A-Za-z0-9._~!$&'()*+,;=:@%\/-]{0,300}$|^\/$/.test(de) || /^\/mudanza/.test(de)) de = '/';
  q.delete('de'); q.delete('viejo');
  var rest = q.toString();
  var target = NEW + de + (rest ? '?' + rest : '') + location.hash;
  var seg = (de.split('/')[1] || '').toLowerCase();
  var app = seg === '' ? 'inicio' : (APPS.indexOf(seg) >= 0 ? seg : 'otros');

  // Si esta misma página se abre ya en el sitio nuevo, no hay nada que avisar.
  if (location.hostname === 'phillyps-bravo.site' || location.hostname === 'www.phillyps-bravo.site') { location.replace(target); return; }

  var $ = function (id) { return document.getElementById(id); };
  var go = $('go'), box = $('box'), v = $('v'), play = $('play'), sound = $('sound'), bar = $('bar'), msg1 = $('msg1');
  go.href = target;
  $('dest').textContent = 'phillyps-bravo.site' + de;
  if (app === 'maia') $('maia').hidden = false;

  // Estadísticas sin cookies ni datos personales: se cuentan en el Worker de monitoreo (resumen semanal).
  function send(e, o) {
    try {
      var body = JSON.stringify(o ? { e: e, o: o } : { e: e });
      navigator.sendBeacon(NEW + '/_avisos/evento', new Blob([body], { type: 'text/plain' }));
    } catch (x) {}
  }
  send('mudanza_vista', app);

  var ready = false;
  function enable() {
    if (ready) return; ready = true;
    go.setAttribute('aria-disabled', 'false'); go.textContent = 'Continuar'; go.classList.add('ready');
    msg1.textContent = 'Listo: ya puedes continuar';
  }
  function lock() { go.setAttribute('aria-disabled', 'true'); go.textContent = 'Espera el final'; }

  go.addEventListener('click', function (ev) {
    if (go.getAttribute('aria-disabled') === 'true') { ev.preventDefault(); return; }
    send('mudanza_continuar', app);
  });
  $('acad').addEventListener('click', function () { send('mudanza_academia'); });

  // Sin video (sin conexión o bloqueado) la persona nunca queda atrapada: Continuar queda activo.
  v.addEventListener('error', function () { box.hidden = true; enable(); });
  box.style.backgroundImage = 'url(' + POSTER + ')';
  v.poster = POSTER; v.src = VIDEO; box.hidden = false; lock();

  // El video se repite sin parar hasta que la persona pulse Continuar. Con loop el evento 'ended' no se dispara,
  // así que el final de la primera vuelta se detecta por el tiempo (o cuando el video vuelve a empezar).
  v.loop = true;
  var sawEnd = false, last = 0;
  function finished() {
    if (!sawEnd) { sawEnd = true; send('mudanza_fin'); }
    bar.style.width = '100%'; enable();
  }
  v.addEventListener('timeupdate', function () {
    if (!v.duration) return;
    if (!sawEnd) bar.style.width = (100 * v.currentTime / v.duration) + '%';
    if (v.currentTime >= v.duration - 0.4 || v.currentTime < last - 1) finished();
    last = v.currentTime;
  });
  v.addEventListener('ended', finished);
  v.addEventListener('playing', function () { play.hidden = true; sound.hidden = !v.muted; });

  // Con audio desde el primer momento. Los navegadores solo lo permiten a veces sin un toque previo:
  // si lo bloquean, arranca en silencio y cualquier toque sobre el video activa el sonido.
  function unmute() { v.muted = false; sound.hidden = true; if (v.paused) v.play(); }
  // El primer toque, clic o tecla en CUALQUIER parte de la página enciende el sonido (no hace falta buscar el botón).
  ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (ev) {
    document.addEventListener(ev, function once(e) {
      if (e.target === go || go.contains(e.target)) return;
      if (v.muted || v.paused) unmute();
      if (!v.muted && !v.paused) ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (x) { document.removeEventListener(x, once, true); });
    }, true);
  });
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (calm) { play.hidden = false; }
  else {
    v.muted = false;
    var p = v.play();
    if (p && p.catch) p.catch(function () {
      v.muted = true;
      var p2 = v.play();
      if (p2 && p2.catch) p2.catch(function () { play.hidden = false; });
      sound.hidden = false;
    });
  }
})();
</script>
</body>
</html>
